<html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<title>MozaVoice · Documento confidencial</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{--bg:#f2f4f6;--surface:#fff;--sunk:#e9edf1;--fg:#15202b;--muted:#56626f;--line:#d6dce3;--accent:#0d5c66;--accent-soft:#dff0f1;--client:#b0640b;--client-soft:#fbeedb;--joint:#5a4a9c;--joint-soft:#ebe7f7;--stop:#a8372a;--stop-soft:#f8e2de;--ok:#1d7a46;--ok-soft:#e1f2e8;--sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#0e141a;--surface:#151d25;--sunk:#1b252f;--fg:#e3e9ef;--muted:#97a4b1;--line:#2a3743;--accent:#5ec3cd;--accent-soft:#163339;--client:#f0a94e;--client-soft:#35260f;--joint:#b2a3f0;--joint-soft:#28224a;--stop:#f1897a;--stop-soft:#3a1c17;--ok:#62cf91;--ok-soft:#14301f;color-scheme:dark}}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.6;padding-inline:16px}
.wrap{max-width:1040px;margin:0 auto;padding-block:24px 90px}
h1,h2,h3,h4{margin:0;line-height:1.25;text-wrap:balance}h1{font-size:2rem}h2{font-size:1.4rem;font-weight:600}h3{font-size:1.05rem;font-weight:600}
p{margin:0;max-width:72ch}.lead{color:var(--muted)}.small{font-size:.82rem;color:var(--muted)}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.conf{background:var(--stop-soft);border:1px solid var(--stop);color:var(--fg);border-radius:10px;padding:12px 16px;font-size:.92rem;margin-bottom:20px}
.conf b{color:var(--stop)}
header.top{display:grid;gap:12px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.85rem;color:var(--muted)}.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}.sw.us{background:var(--accent)}.sw.cl{background:var(--client)}.sw.jt{background:var(--joint)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:4px}
.tile b{font-family:var(--mono);font-size:1.45rem;font-weight:600}.tile small{color:var(--muted);font-size:.82rem}
nav.index{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:-16px;padding:10px 16px;overflow-x:auto;white-space:nowrap}
nav.index a{display:inline-block;margin-right:4px;padding:5px 10px;border-radius:6px;text-decoration:none;color:var(--muted);font-size:.86rem;font-weight:500}
nav.index a:hover{background:var(--accent-soft);color:var(--accent)}
section{display:grid;gap:16px;padding-block:36px;border-bottom:1px solid var(--line);scroll-margin-top:56px}section>header{display:grid;gap:6px}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.gantt{display:grid;grid-template-columns:200px repeat(13,minmax(44px,1fr));min-width:820px;font-size:.84rem}
.gantt .hd{font-family:var(--mono);font-size:.7rem;color:var(--muted);padding:8px 4px;border-bottom:1px solid var(--line);text-align:center}.gantt .hd.first{text-align:left;padding-left:12px}
.gantt .lab{padding:8px 12px;border-bottom:1px solid var(--line);font-weight:500}.gantt .cell{border-bottom:1px solid var(--line);border-left:1px dashed var(--line);min-height:38px}
.gantt .bar{align-self:center;height:20px;border-radius:5px;margin:8px 3px}.bar.us{background:var(--accent)}.bar.cl{background:var(--client)}.bar.jt{background:var(--joint)}
.gate{font-family:var(--mono);font-size:.7rem;color:var(--stop);font-weight:600}
.phases{display:grid;gap:14px;margin:0;padding:0;list-style:none}
.phase{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px}
.phase .head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between}.phase .when{font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.cols3{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.lane{border-radius:8px;padding:10px 12px;display:grid;gap:6px;align-content:start;min-width:0}.lane.cl{background:var(--client-soft)}.lane.us{background:var(--accent-soft)}.lane.out{background:var(--sunk)}
.lane h4{font-family:var(--mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase}.lane.cl h4{color:var(--client)}.lane.us h4{color:var(--accent)}.lane.out h4{color:var(--muted)}
.lane ul,.bul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:.9rem}
.meta-row{display:flex;flex-wrap:wrap;gap:8px}.chip{font-family:var(--mono);font-size:.72rem;padding:3px 9px;border-radius:999px}.chip.gate{background:var(--stop-soft);color:var(--stop)}
.intake{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:8px;align-content:start;min-width:0}
.plainlist{list-style:none;margin:0;padding:0;display:grid;gap:5px}.plainlist li{display:grid;grid-template-columns:1fr auto;gap:8px;font-size:.9rem}
.plainlist em{font-style:normal;font-family:var(--mono);font-size:.68rem;color:var(--client);white-space:nowrap;margin-top:3px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.steps{margin:0;padding-left:18px;display:grid;gap:5px;font-size:.9rem}
svg text{font-family:var(--sans)}.dg-us{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5}.dg-cl{fill:var(--client-soft);stroke:var(--client);stroke-width:1.5}
.dg-line{stroke:var(--muted);stroke-width:1.5;fill:none}.dg-t{fill:var(--fg);font-size:13px;font-weight:600}.dg-s{fill:var(--muted);font-size:11px}.dg-l{fill:var(--accent);font-size:10.5px;font-family:var(--mono)}.dg-arrow{fill:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:.9rem}th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}tr:last-child td{border-bottom:0}
td.n{text-align:right;font-family:var(--mono)}.wf{min-width:760px}
.stack{display:grid;gap:10px}
.layer{display:grid;grid-template-columns:56px 1fr;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;align-items:start}
.layer .ln{font-family:var(--mono);font-size:1.3rem;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:10px;height:44px;display:flex;align-items:center;justify-content:center}
.layer .lb{display:grid;gap:4px;min-width:0}.layer ul{margin:4px 0 0;padding-left:18px;display:grid;gap:3px;font-size:.9rem}
.layer:first-child{border-color:var(--accent)}
.never{border-color:var(--stop)}.never h3{color:var(--stop)}
.price .big{font-family:var(--mono);font-size:2.4rem;font-weight:600;color:var(--accent);line-height:1}
.foot{padding-block:24px;color:var(--muted);font-size:.82rem;text-align:center}
/* gate screen */
.lock{min-height:80vh;display:grid;place-items:center}
.lock .box{max-width:440px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;display:grid;gap:14px}
.lock input{font:inherit;font-family:var(--mono);padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);width:100%}
.lock button{font:inherit;font-weight:600;padding:10px 14px;border-radius:8px;border:0;background:var(--accent);color:var(--surface);cursor:pointer}
.lock .err{color:var(--stop);font-size:.88rem;min-height:1.2em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
